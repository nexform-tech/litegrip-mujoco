[metadata]
name = litegrip-mujoco
# 占位符：真正的版本由 semantic-release 从 commit 前缀算出（AGENTS.md §3）。
# CI 只在发布工作区里覆盖它；仓库里永远是这一行。
#
# 用 `+semantic-release` 而不是仓库标准写的 `-semantic-release`：后者是合法的
# semver 但不是合法的 PEP 440，pip 会把整个配置判为非法。详见 pyproject.toml。
version = 0.0.0+semantic-release
description = LiteGrip MuJoCo simulation, API-compatible with the litegrip SDK
long_description = file: README.md
long_description_content_type = text/markdown
author = hzh
license = Proprietary
classifiers =
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.10
    Programming Language :: Python :: 3.11
    Programming Language :: Python :: 3.12

[options]
python_requires = >=3.10
package_dir =
    = src
packages = find:
install_requires =
    mujoco>=3.0
    numpy>=1.21

[options.packages.find]
where = src

[options.package_data]
litegrip_mujoco =
    assets/*.xml
    assets/meshes/*.STL

[options.extras_require]
dev =
    pytest
    pytest-timeout
mirror =
    litegrip
